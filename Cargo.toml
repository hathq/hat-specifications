[package]
exclude = ["/registration/**", "/state/**", "/.local/**", "/.state/**", "/.data/**", "/secrets/**", "/credentials/**", "/.env", "/.env.production", "/.env.local", "/*.tgz", "/*.tar.gz", "/*.tar", "/*.zip", "/*.whl", "/*.crate", "/.ruff_cache/**", "/.mypy_cache/**", "/.tox/**", "/.nox/**", "/.hypothesis/**", "/.coverage", "/.coverage.*", "/htmlcov/**", "/lcov.info", "/junit.xml", "/*.profraw", "/*.profdata", "/*.egg-info/**", "/target/**", "/node_modules/**", "/dist/**", "/build/**", "/.cache/**", "/.pytest_cache/**", "/coverage/**"]
name = "hat-specifications"
version = "0.10.0"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
description = "Versioned HAT and Fitting contract validator"
publish = ["ecosystem-private"]
readme = "README.md"
repository = "https://github.com/hathq/hat-specifications"
homepage = "https://github.com/hathq/hat-specifications"
documentation = "https://docs.rs/hat-specifications"

[package.metadata.hathq]
boundary = "schema-validation"
external-actions = false
credentials = false

[dependencies]
zixcel-revision = { version = "=0.10.0", default-features = false }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.10.9"
toml = "0.8.23"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"
